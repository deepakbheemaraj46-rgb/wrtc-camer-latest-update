<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px/1.5 system-ui,Arial}main{max-width:1100px;margin:auto;padding:22px 15px}section{background:#151d31;border:1px solid #30405f;border-radius:16px;padding:17px;margin:15px 0}p{color:#b5c1d8}input,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #405071}input{background:#0b1428;color:white;width:100%}button{background:#9bbcff;color:#081329;font-weight:700;cursor:pointer}.secondary{background:#293853;color:white}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}label{display:block;color:#b5c1d8;font-size:.9rem;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}.card{background:#0b1428;border:1px solid #30405f;border-radius:12px;padding:12px;min-width:0}video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#020617;border-radius:8px}.status{font-weight:650}
</style></head><body><main><h1>Live Viewer</h1><p>Connect to watch camera owners who have deliberately started sharing.</p><section><div class="row"><div class="field"><label>Room code</label><input id="room" maxlength="32" placeholder="Enter room code"></div><button id="connect">Connect</button><button id="disconnect" class="secondary" disabled>Disconnect</button></div><p id="status" class="status">Not connected</p></section><section><h2>Live cameras</h2><div id="streams" class="grid"></div></section></main>
<script src="/socket.io/socket.io.js"></script><script>
(() => {
const $=id=>document.getElementById(id),socket=io({reconnection:true,reconnectionDelay:500,reconnectionDelayMax:3000}),pcs=new Map(),cards=new Map();let code="",joined=false;
const rtc={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const q=new URLSearchParams(location.search).get("room");if(q)$("room").value=q;
function status(s){$("status").textContent=s}function send(to,data){socket.emit("signal",{to,data})}
function addCard(id,label){if(cards.has(id))return cards.get(id);const card=document.createElement("div");card.className="card";const h=document.createElement("h3");h.textContent=label||"Camera";const video=document.createElement("video");video.autoplay=true;video.playsInline=true;video.controls=true;const row=document.createElement("div");row.className="row";const fs=document.createElement("button");fs.className="secondary";fs.textContent="Fullscreen";fs.onclick=()=>video.requestFullscreen?.();const mute=document.createElement("button");mute.className="secondary";mute.textContent="Mute";mute.onclick=()=>{video.muted=!video.muted;mute.textContent=video.muted?"Unmute":"Mute"};const hint=document.createElement("p");hint.textContent="Waiting for stream…";row.append(fs,mute);card.append(h,video,row,hint);$("streams").append(card);const c={card,video,hint};cards.set(id,c);return c}
async function offerTo(camera){if(!joined||pcs.has(camera.id))return;const pc=new RTCPeerConnection(rtc);pcs.set(camera.id,pc);const c=addCard(camera.id,camera.label);pc.ontrack=e=>{if(e.streams[0])c.video.srcObject=e.streams[0];c.hint.textContent="Live audio/video";c.video.play().catch(()=>c.hint.textContent="Press Play to hear and view the stream.")};pc.onicecandidate=e=>{if(e.candidate)send(camera.id,{candidate:e.candidate})};pc.onconnectionstatechange=()=>{c.hint.textContent=pc.connectionState==="connected"?"Live":`Connection: ${pc.connectionState}`};try{const offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true});await pc.setLocalDescription(offer);send(camera.id,{description:pc.localDescription})}catch{c.hint.textContent="Could not connect; disconnect and retry."}}
async function onSignal({from,data}){const pc=pcs.get(from);if(!pc)return;try{if(data.description)await pc.setRemoteDescription(data.description);if(data.candidate)await pc.addIceCandidate(data.candidate)}catch{}}
function connect(){code=$("room").value.trim();if(!/^[A-Za-z0-9-]{4,32}$/.test(code)){status("Enter a room code with 4–32 letters, numbers, or hyphens.");return}socket.emit("join",{code,role:"viewer",label:"Viewer"});status("Connecting…")}
$("connect").onclick=connect;$("disconnect").onclick=()=>{for(const [id,pc] of pcs){pc.close();cards.get(id)?.card.remove()}pcs.clear();cards.clear();socket.emit("leave");joined=false;$("connect").disabled=false;$("disconnect").disabled=true;status("Disconnected")};
socket.on("joined",info=>{joined=true;$("connect").disabled=true;$("disconnect").disabled=false;status("Connected to room: "+code);(info.cameras||[]).forEach(offerTo)});
socket.on("camera-added",offerTo);socket.on("camera-removed",({id})=>{pcs.get(id)?.close();pcs.delete(id);cards.get(id)?.card.remove();cards.delete(id)});
socket.on("signal",onSignal);socket.on("app-error",status);socket.on("disconnect",()=>status("Connection lost; reconnecting…"));
socket.on("connect",()=>{if(code&&joined)socket.emit("join",{code,role:"viewer",label:"Viewer"})});
window.addEventListener("pagehide",()=>{for(const pc of pcs.values())pc.close()});
})();
</script></body></html>
